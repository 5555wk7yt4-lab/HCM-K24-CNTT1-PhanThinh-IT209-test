name: CI/CD Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Validate Docker build
        run: |
          docker build -t campus-hub-backend:ci .

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m

          script: |
            set -eu

            REPO="https://github.com/5555wk7yt4-lab/HCM-K24-CNTT1-PhanThinh-IT209-test.git"
            APP_DIR="$HOME/campus-hub-base"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git remote set-url origin "$REPO"
            git fetch origin main
            git checkout -B main origin/main

            if [ ! -f .env ]; then
              echo "ERROR: Missing .env on VPS"
              exit 1
            fi

            docker compose config --quiet

            docker compose up -d \
              --build \
              --remove-orphans

            docker compose ps

            docker image prune -f