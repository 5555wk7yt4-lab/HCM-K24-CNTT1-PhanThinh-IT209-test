
name: CI/CD Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate Docker builds
        run: |
          docker build --target backend -t campus-hub-backend:ci .
          docker build --target frontend -t campus-hub-frontend:ci .

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu
            APP_DIR="$HOME/campus-hub-base"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/dinhthanhnam/campus-hub-base.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout -B main origin/main
            test -f .env || { echo 'Missing .env on VPS (DB_PASSWORD, MYSQL_ROOT_PASSWORD)'; exit 1; }
            docker compose config --quiet
            docker compose up -d --build --remove-orphans
            docker compose ps