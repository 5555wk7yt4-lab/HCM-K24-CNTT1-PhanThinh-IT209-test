services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:123456789}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:123456789}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - internal

  backend:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    ports:
      - "127.0.0.1:${HOST_PORT:-8086}:8086"

    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:mysql://db:3306/campus_hub
      DB_USERNAME: campus
      DB_PASSWORD: ${DB_PASSWORD:123456789}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8086}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge